version: v0.1

tables:
  fact_order:
    aliases:
      - 订单
      - 交易订单
      - 支付订单
    description: >
      订单事实表。一条记录代表一个业务订单。
    business_rules:
      - "total_amount 表示下单总金额，不等同于实际支付金额。"
      - "paid_amount 表示订单成功支付的实际金额。"
      - "status = 'PAID' 表示订单已经成功支付。"
      - "支付时间分析应使用 paid_at，而不是 created_at。"
      - "计算退款后净收入时需要结合 fact_refund。"
    column_semantics:
      id:
        description: 订单唯一标识
      user_id:
        description: 下单用户
      channel_id:
        description: 获客/订单渠道维度
      total_amount:
        description: 下单总金额
        aliases: [GMV候选金额, 下单金额]
      paid_amount:
        description: 实际成功支付金额
        aliases: [支付金额, 实付金额]
      created_at:
        description: 订单创建时间
      paid_at:
        description: 支付成功时间
      completed_at:
        description: 订单业务完成时间
    typical_use_cases:
      - 订单量
      - GMV
      - 实际支付金额
      - 用户购买分析
      - 渠道销售分析

  fact_payment_transaction:
    aliases:
      - 支付流水
      - 支付尝试
      - payment transaction
    description: >
      支付交易尝试事实表。一个订单可以存在多次支付尝试，因此不能直接以流水行数作为订单数。
    business_rules:
      - "一个 order_id 可以有多条交易尝试。"
      - "只有 status = 'SUCCESS' 的交易表示成功支付尝试。"
      - "统计订单数时不要 COUNT 本表行数代替订单数。"
    column_semantics:
      order_id:
        description: 关联业务订单
      amount:
        description: 本次支付尝试金额
      status:
        description: 支付尝试状态
      attempted_at:
        description: 支付尝试时间
    typical_use_cases:
      - 支付成功率
      - 支付失败分析
      - 支付尝试次数

  fact_refund:
    aliases:
      - 退款
      - 退款流水
    description: >
      退款事实表。一张订单可以发生零次或多次退款。
    business_rules:
      - "净收入类指标需要按业务定义从成功支付金额中扣除有效退款。"
    column_semantics:
      order_id:
        description: 被退款订单
      refund_amount:
        description: 有效退款金额
      refunded_at:
        description: 退款发生时间
    typical_use_cases:
      - 退款金额
      - 退款率
      - 净收入

  dim_user:
    aliases:
      - 用户
      - 用户维表
    description: >
      用户维度表。一条记录代表一个用户。
    business_rules:
      - "region_id 关联 dim_region.id。"
      - "channel_id 表示用户注册/获客渠道。"
    column_semantics:
      id:
        description: 用户ID
      region_id:
        description: 用户地区ID
      channel_id:
        description: 用户注册渠道
      registered_at:
        description: 用户注册时间
    typical_use_cases:
      - 新增用户
      - 地区分析
      - 渠道用户分析

  dim_region:
    aliases:
      - 地区
      - 省份
      - region
    description: 用户地区维度。
    business_rules: []
    column_semantics:
      id:
        description: 地区ID
      province:
        description: 省份名称
      city:
        description: 城市名称
    typical_use_cases:
      - 省份分组
      - 城市分组
