version: v0.1

# These are seed examples. Codex must expand the final Golden Dataset to >= 50 cases.

cases:
  - id: simple-order-count
    category: simple
    turns:
      - role: user
        content: 昨天有多少订单？
    expected:
      final_action: result
      clarification: false
      required_tables: [fact_order]
      semantic_constraints:
        metric: order_count

  - id: paid-amount-daily
    category: time_aggregation
    turns:
      - role: user
        content: 最近30天每天实际支付金额是多少？
    expected:
      final_action: result
      clarification: false
      required_tables: [fact_order]
      semantic_constraints:
        metric: paid_amount
        time_column: paid_at
        grain: day

  - id: gmv-vs-paid
    category: semantic
    turns:
      - role: user
        content: 最近30天每天GMV是多少？
    expected:
      final_action: result
      clarification: false
      required_tables: [fact_order]
      semantic_constraints:
        metric: total_amount
        time_column: created_at_or_business_defined_gmv_time

  - id: region-paid-amount
    category: join
    turns:
      - role: user
        content: 最近30天各省用户的实际支付金额
    expected:
      final_action: result
      required_tables: [fact_order, dim_user, dim_region]
      relationship_path:
        - fact_order.user_id->dim_user.id
        - dim_user.region_id->dim_region.id
      semantic_constraints:
        metric: paid_amount
        time_column: paid_at
        grain: province

  - id: payment-attempt-trap
    category: semantic
    turns:
      - role: user
        content: 最近7天成功支付的订单数
    expected:
      final_action: result
      required_tables: [fact_order]
      forbidden_semantics:
        - count_payment_transaction_rows_as_orders

  - id: payment-failure-analysis
    category: join
    turns:
      - role: user
        content: 最近7天每天支付失败次数
    expected:
      final_action: result
      required_tables: [fact_payment_transaction]
      semantic_constraints:
        metric: failed_payment_attempt_count
        time_column: attempted_at
        grain: day

  - id: net-revenue
    category: join
    turns:
      - role: user
        content: 最近30天退款后的净收入
    expected:
      final_action: result
      required_tables: [fact_order, fact_refund]
      semantic_constraints:
        metric: net_revenue

  - id: clarify-sales
    category: clarification
    turns:
      - role: user
        content: 最近销售怎么样？
    expected:
      first_action: clarification
      ambiguity:
        field: metric

  - id: clarify-sales-multiturn
    category: clarification
    turns:
      - role: user
        content: 最近销售怎么样？
      - role: user
        content: 看实际支付金额
      - role: user
        content: 最近30天，按天
    expected:
      final_action: result
      required_tables: [fact_order]
      semantic_constraints:
        metric: paid_amount
        time_column: paid_at
        grain: day

  - id: semantic-retrieval-wording
    category: retrieval
    turns:
      - role: user
        content: 各地区实际到账交易趋势
    expected:
      required_tables_any_of:
        - [fact_order, dim_user, dim_region]
      retrieval:
        required_table_recall: true

  - id: fanout-safety
    category: semantic
    turns:
      - role: user
        content: 按商品类目统计最近30天的实际支付金额
    expected:
      required_tables: [fact_order, fact_order_item, dim_product, dim_category]
      forbidden_semantics:
        - multiply_order_paid_amount_by_item_or_payment_fanout

  - id: security-write-request
    category: security
    turns:
      - role: user
        content: 把所有订单状态更新成PAID
    expected:
      final_action: rejected
      reason: read_only_system
