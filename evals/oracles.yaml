version: oracle-v0.1
queries:
  simple-order-count: "SELECT COUNT(DISTINCT id) AS order_count FROM fact_order"
  simple-paid-order-count: "SELECT COUNT(*) AS paid_order_count FROM fact_order WHERE status IN ('PAID','COMPLETED')"
  simple-pending-order-count: "SELECT COUNT(*) AS pending_order_count FROM fact_order WHERE status = 'PENDING'"
  simple-cancelled-order-count: "SELECT COUNT(*) AS cancelled_order_count FROM fact_order WHERE status = 'CANCELLED'"
  simple-gmv: "SELECT SUM(total_amount) AS gmv FROM fact_order"
  simple-paid-amount: "SELECT SUM(paid_amount) AS paid_amount FROM fact_order WHERE status IN ('PAID','COMPLETED')"
  simple-successful-refund: "SELECT SUM(refund_amount) AS successful_refund_amount FROM fact_refund WHERE status = 'SUCCESS'"
  simple-payment-attempts: "SELECT COUNT(*) AS payment_attempt_count FROM fact_payment_transaction"
  simple-failed-attempts: "SELECT COUNT(*) AS failed_payment_attempt_count FROM fact_payment_transaction WHERE status = 'FAILED'"
  simple-user-count: "SELECT COUNT(*) AS user_count FROM dim_user"
  simple-product-count: "SELECT COUNT(*) AS product_count FROM dim_product"
  simple-event-count: "SELECT COUNT(*) AS event_count FROM fact_user_event"
  simple-unit-sales: "SELECT SUM(quantity) AS unit_sales FROM fact_order_item"
  simple-completed-orders: "SELECT COUNT(*) AS completed_order_count FROM fact_order WHERE status = 'COMPLETED'"
  simple-paid-users: "SELECT COUNT(DISTINCT user_id) AS paid_user_count FROM fact_order WHERE status IN ('PAID','COMPLETED')"
  agg-paid-order-channel: "SELECT c.name AS order_channel, SUM(o.paid_amount) AS paid_amount FROM fact_order o JOIN dim_channel c ON o.channel_id=c.id WHERE o.status IN ('PAID','COMPLETED') GROUP BY c.name"
  agg-paid-acquisition-channel: "SELECT c.name AS acquisition_channel, SUM(o.paid_amount) AS paid_amount FROM fact_order o JOIN dim_user u ON o.user_id=u.id JOIN dim_channel c ON u.channel_id=c.id WHERE o.status IN ('PAID','COMPLETED') GROUP BY c.name"
  agg-paid-province: "SELECT r.province, SUM(o.paid_amount) AS paid_amount FROM fact_order o JOIN dim_user u ON o.user_id=u.id JOIN dim_region r ON u.region_id=r.id WHERE o.status IN ('PAID','COMPLETED') GROUP BY r.province"
  agg-orders-status: "SELECT status AS order_status, COUNT(*) AS order_count FROM fact_order GROUP BY status"
  agg-gmv-status: "SELECT status AS order_status, SUM(total_amount) AS gmv FROM fact_order GROUP BY status"
  agg-attempts-status: "SELECT status AS payment_status, COUNT(*) AS payment_attempt_count FROM fact_payment_transaction GROUP BY status"
  agg-refund-status: "SELECT status AS refund_status, SUM(refund_amount) AS refund_amount FROM fact_refund GROUP BY status"
  agg-units-product: "SELECT p.name AS product_name, SUM(i.quantity) AS unit_sales FROM fact_order_item i JOIN dim_product p ON i.product_id=p.id GROUP BY p.name"
  agg-units-category: "SELECT c.name AS product_category, SUM(i.quantity) AS unit_sales FROM fact_order_item i JOIN dim_product p ON i.product_id=p.id JOIN dim_category c ON p.category_id=c.id GROUP BY c.name"
  agg-users-province: "SELECT r.province, COUNT(*) AS user_count FROM dim_user u JOIN dim_region r ON u.region_id=r.id GROUP BY r.province"
  agg-users-channel: "SELECT c.name AS acquisition_channel, COUNT(*) AS user_count FROM dim_user u JOIN dim_channel c ON u.channel_id=c.id GROUP BY c.name"
  agg-events-name: "SELECT event_name, COUNT(*) AS event_count FROM fact_user_event GROUP BY event_name"
  agg-events-channel: "SELECT c.name AS acquisition_channel, COUNT(*) AS event_count FROM fact_user_event e JOIN dim_user u ON e.user_id=u.id JOIN dim_channel c ON u.channel_id=c.id GROUP BY c.name"
  agg-paid-date: "SELECT DATE(paid_at) AS period, SUM(paid_amount) AS paid_amount FROM fact_order WHERE status IN ('PAID','COMPLETED') AND paid_at >= '2026-07-01' AND paid_at < '2026-09-01' GROUP BY DATE(paid_at)"
  agg-orders-date: "SELECT DATE(created_at) AS period, COUNT(*) AS order_count FROM fact_order WHERE created_at >= '2026-08-01' AND created_at < '2026-09-01' GROUP BY DATE(created_at)"
  agg-refunds-date: "SELECT DATE(refunded_at) AS period, SUM(refund_amount) AS refund_amount FROM fact_refund WHERE refunded_at >= '2026-07-01' AND refunded_at < '2026-09-01' GROUP BY DATE(refunded_at)"
  agg-failed-attempts-date: "SELECT DATE(attempted_at) AS period, COUNT(*) AS failed_payment_attempt_count FROM fact_payment_transaction WHERE status = 'FAILED' AND attempted_at >= '2026-08-01' AND attempted_at < '2026-09-01' GROUP BY DATE(attempted_at)"
  agg-gmv-channel: "SELECT c.name AS order_channel, SUM(o.total_amount) AS gmv FROM fact_order o JOIN dim_channel c ON o.channel_id=c.id GROUP BY c.name"
  agg-orders-channel: "SELECT c.name AS order_channel, COUNT(*) AS order_count FROM fact_order o JOIN dim_channel c ON o.channel_id=c.id GROUP BY c.name"
  agg-active-users-province: "SELECT r.province, COUNT(DISTINCT e.user_id) AS active_user_count FROM fact_user_event e JOIN dim_user u ON e.user_id=u.id JOIN dim_region r ON u.region_id=r.id GROUP BY r.province"
  agg-users-register-date: "SELECT DATE(registered_at) AS period, COUNT(*) AS user_count FROM dim_user WHERE registered_at >= '2026-06-01' AND registered_at < '2026-09-01' GROUP BY DATE(registered_at)"
  agg-products-category: "SELECT c.name AS product_category, COUNT(*) AS product_count FROM dim_product p JOIN dim_category c ON p.category_id=c.id GROUP BY c.name"
  join-net-revenue: "SELECT (SELECT SUM(paid_amount) FROM fact_order WHERE status IN ('PAID','COMPLETED')) - (SELECT COALESCE(SUM(refund_amount),0) FROM fact_refund WHERE status = 'SUCCESS') AS net_revenue"
  join-attempts-order: "SELECT o.status AS order_status, COUNT(t.id) AS payment_attempt_count FROM fact_order o JOIN fact_payment_transaction t ON t.order_id=o.id GROUP BY o.status"
  join-units-order: "SELECT o.status AS order_status, SUM(i.quantity) AS unit_sales FROM fact_order o JOIN fact_order_item i ON i.order_id=o.id GROUP BY o.status"
  join-units-attempts-order: "SELECT o.id AS order_id, i.unit_sales, t.payment_attempt_count FROM fact_order o JOIN (SELECT order_id, SUM(quantity) AS unit_sales FROM fact_order_item GROUP BY order_id) i ON i.order_id=o.id JOIN (SELECT order_id, COUNT(*) AS payment_attempt_count FROM fact_payment_transaction GROUP BY order_id) t ON t.order_id=o.id"
  join-paid-orders-category: "SELECT c.name AS product_category, SUM(x.paid_amount) AS paid_amount FROM (SELECT DISTINCT o.id, o.paid_amount, p.category_id FROM fact_order o JOIN fact_order_item i ON i.order_id=o.id JOIN dim_product p ON i.product_id=p.id WHERE o.status IN ('PAID','COMPLETED')) x JOIN dim_category c ON x.category_id=c.id GROUP BY c.name"
  join-paid-city: "SELECT r.city, SUM(o.paid_amount) AS paid_amount FROM fact_order o JOIN dim_user u ON o.user_id=u.id JOIN dim_region r ON u.region_id=r.id WHERE o.status IN ('PAID','COMPLETED') GROUP BY r.city"
  join-events-city: "SELECT r.city, COUNT(*) AS event_count FROM fact_user_event e JOIN dim_user u ON e.user_id=u.id JOIN dim_region r ON u.region_id=r.id GROUP BY r.city"
  join-units-price-product: "SELECT p.name AS product_name, SUM(i.quantity * i.unit_price) AS item_sales_amount FROM fact_order_item i JOIN dim_product p ON i.product_id=p.id GROUP BY p.name"
  join-refunds-order: "SELECT o.status AS order_status, SUM(r.refund_amount) AS refund_amount FROM fact_order o JOIN fact_refund r ON r.order_id=o.id GROUP BY o.status"
  join-paid-users-channel: "SELECT c.name AS acquisition_channel, COUNT(DISTINCT o.user_id) AS paid_user_count FROM fact_order o JOIN dim_user u ON o.user_id=u.id JOIN dim_channel c ON u.channel_id=c.id WHERE o.status IN ('PAID','COMPLETED') GROUP BY c.name"
  trap-gmv-versus-paid: "SELECT SUM(total_amount) AS gmv, SUM(CASE WHEN status IN ('PAID','COMPLETED') THEN paid_amount ELSE 0 END) AS paid_amount FROM fact_order"
  empty-future-orders: "SELECT COUNT(*) AS order_count FROM fact_order WHERE created_at >= '2030-01-01' AND created_at < '2030-02-01'"
  empty-future-paid: "SELECT DATE(paid_at) AS period, SUM(paid_amount) AS paid_amount FROM fact_order WHERE status IN ('PAID','COMPLETED') AND paid_at >= '2030-01-01' AND paid_at < '2030-02-01' GROUP BY DATE(paid_at)"
  multiturn-sales: "SELECT SUM(paid_amount) AS paid_amount FROM fact_order WHERE status IN ('PAID','COMPLETED') AND paid_at >= '2026-08-01' AND paid_at < '2026-09-01'"
  multiturn-orders: "SELECT status AS order_status, COUNT(*) AS order_count FROM fact_order WHERE created_at >= '2026-08-01' AND created_at < '2026-09-01' GROUP BY status"
  correction-paid-month: "SELECT SUM(paid_amount) AS paid_amount FROM fact_order WHERE status IN ('PAID','COMPLETED') AND paid_at >= '2026-08-01' AND paid_at < '2026-09-01'"
  correction-user-grain: "SELECT c.name AS acquisition_channel, COUNT(*) AS user_count FROM dim_user u JOIN dim_channel c ON u.channel_id=c.id GROUP BY c.name"
