version: "3"

env:
  UV_CACHE_DIR: "{{.ROOT_DIR}}/.var/uv-cache"

tasks:
  sync:
    desc: Install the locked Python development environment
    cmds:
      - uv sync --all-groups

  bootstrap:
    desc: Prepare the local deterministic development environment
    deps: [sync]
    cmds:
      - uv run data-agent bootstrap

  dev:
    desc: Run the local FastAPI development server
    deps: [sync]
    cmds:
      - uv run uvicorn 'data_agent.api:create_app' --factory --host "${APP_HOST:-127.0.0.1}" --port "${APP_PORT:-8000}" --reload

  quality:
    desc: Run formatting, lint, type, and deterministic test gates
    deps: [sync]
    cmds:
      - uv run ruff format --check src tests eval_harness
      - uv run ruff check src tests eval_harness
      - uv run mypy
      - uv run pytest

  eval:
    desc: Run all stage evals and the public-API Golden Dataset acceptance
    deps: [sync]
    cmds:
      - uv run python -m eval_harness

  m15-attribution:
    desc: Attribute an existing M15 acceptance report without rerunning models
    deps: [sync]
    cmds:
      - uv run python -m eval_harness.attribution

  m15-behavioral-diagnosis:
    desc: Replay the exact 35 M8 and six false-accept M15 diagnostic cases
    deps: [sync]
    cmds:
      - uv run python -m eval_harness.behavioral_diagnosis

  m10-eval:
    desc: Run the standalone M10 SQL guard and EXPLAIN evaluation
    deps: [sync]
    cmds:
      - uv run data-agent sql-guard-eval

  m8-readiness-eval:
    desc: Run the provider-free M8 deterministic readiness evaluation
    deps: [sync]
    cmds:
      - uv run data-agent m8-readiness-eval

  m11-eval:
    desc: Run the standalone M11 read-only runtime evaluation
    deps: [sync]
    cmds:
      - uv run data-agent runtime-eval

  m12-eval:
    desc: Run the standalone M12 deterministic verification evaluation
    deps: [sync]
    cmds:
      - uv run data-agent verification-eval

  m13-eval:
    desc: Run the standalone M13 deterministic repair eligibility evaluation
    deps: [sync]
    cmds:
      - uv run data-agent repair-eval

  m13-ollama-smoke:
    desc: Run the bound three-case real Ollama M13 repair smoke
    deps: [sync]
    cmds:
      - uv run data-agent repair-ollama-eval

  m14-eval:
    desc: Run the standalone M14 grounding and response-authority evaluation
    deps: [sync]
    cmds:
      - uv run data-agent answer-eval

  m14-ollama-smoke:
    desc: Run the bound three-case real Ollama M14 answer smoke
    deps: [sync]
    cmds:
      - uv run data-agent answer-ollama-eval

  m14-e2e-smoke:
    desc: Run one real HTTP path through Ollama, MySQL, and M8-M14
    deps: [sync]
    cmds:
      - RUN_OLLAMA_INTEGRATION=1 uv run pytest tests/integration/test_conversation_e2e.py

  m16-remote-smoke:
    desc: Run the bounded OpenAI-compatible M16 control-flow smoke
    deps: [sync]
    cmds:
      - RUN_OPENAI_COMPATIBLE_INTEGRATION=1 uv run pytest tests/integration/test_openai_compatible_runtime.py

  m17-preflight:
    desc: Run the non-mutating external MySQL metadata preflight
    deps: [sync]
    cmds:
      - uv run data-agent analytics-preflight

  m17-external-smoke:
    desc: Run the opt-in product-opinion external MySQL conformance smoke
    deps: [sync]
    cmds:
      - RUN_EXTERNAL_MYSQL_INTEGRATION=1 uv run pytest tests/integration/test_external_mysql_runtime.py

  reset:
    desc: Reset generated local state
    deps: [sync]
    cmds:
      - uv run data-agent reset
