name: data-agent

services:
  mysql:
    image: mysql:8.4.11
    container_name: data-agent-mysql
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-data_agent}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me-local-only}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent',
        ]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 15s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql-data:
